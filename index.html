<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario TCS">
<meta name="theme-color" content="#151a21">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Inventario TCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control-room header, stacked equipment cards, bottom sheet for quick entry */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e3e8ed; --ink:#121821; --muted:#5b6675; --line:#d3dae2;
  --accent:#d4263c; --accent-ink:#ffffff; --ok:#2b8a57; --warn:#a86b12; --bad:#c0392b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --surface:#171c23; --sunk:#11161c; --ink:#e7ebf0; --muted:#97a3b2; --line:#2a323d;
  --accent:#ff4a5c; --accent-ink:#1a0306; --ok:#4cc386; --warn:#e0a446; --bad:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#171c23; --sunk:#11161c; --ink:#e7ebf0; --muted:#97a3b2; --line:#2a323d;
  --accent:#ff4a5c; --accent-ink:#1a0306; --ok:#4cc386; --warn:#e0a446; --bad:#ff6b5e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tally{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sync{margin-left:auto;font:500 12px var(--body);letter-spacing:0;text-transform:none}
.sync.off{color:var(--warn)}
#place{width:100%;border:0;background:transparent;font:700 28px/1.1 var(--display);padding:0;text-wrap:balance}
#place::placeholder{color:var(--muted);opacity:.7}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;white-space:nowrap}

main{padding-top:14px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;text-align:left;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card-top{display:flex;gap:10px;align-items:baseline}
.card-name{font-weight:600;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.qty{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.qty::before{content:"×"}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 14px;font-size:13px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.card-note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty h2{margin:0;font:700 22px var(--display);color:var(--ink)}
.empty p{margin:0;max-width:40ch}

#notesView{display:grid;gap:10px}
#notes{width:100%;min-height:55vh;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;line-height:1.6;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}

.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--display);letter-spacing:.04em;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font:700 22px var(--display);flex:1}
.field{display:grid;gap:5px}
.field>label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px}
.field textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px;margin-bottom:-10px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.grow{flex:1}
.colrow{display:flex;gap:6px;align-items:center}
.colrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.colrow .t{font-size:11px;color:var(--muted);width:56px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="brand"><span class="tally"></span>Inventario de equipos<span class="sync" id="sync">Se guarda en este teléfono</span></div>
    <input id="place" placeholder="¿Dónde es la visita?" aria-label="Empresa o lugar de la visita">
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabItems" aria-selected="true">Equipos</button>
      <button role="tab" id="tabNotes" aria-selected="false">Notas</button>
    </div>
    <div class="row" id="toolRow">
      <input class="search" id="q" type="search" placeholder="Buscar nombre, modelo, serie…">
      <button class="iconbtn" id="btnCols">Columnas</button>
      <button class="iconbtn" id="btnExport">Exportar</button>
    </div>
  </header>
  <main>
    <section id="itemsView"><div class="list" id="list"></div></section>
    <section id="notesView" hidden>
      <div class="row"><button class="iconbtn" id="btnStamp">+ Marcar hora</button><span class="hint">Apuntes generales de la visita: quién los recibió, cómo organizan la bodega, dudas…</span></div>
      <textarea id="notes" placeholder="Escribe aquí tus apuntes…"></textarea>
    </section>
  </main>
</div>
<button class="fab" id="fab">+ Agregar equipo</button>
<div id="sheetHost"></div>

<script>
(function(){
const CATS=["Micrófono","Cámara","Lente","Memoria / SD","Trípode","Iluminación","Audio / Mezcla","Cable","Batería","Monitor","Otro"];
const DEFAULT_COLS=[
  {id:"nombre",label:"Equipo",type:"text"},
  {id:"categoria",label:"Categoría",type:"choice",options:CATS},
  {id:"marca",label:"Marca",type:"text"},
  {id:"modelo",label:"Modelo",type:"text"},
  {id:"serie",label:"N° de serie",type:"text",mono:true},
  {id:"cantidad",label:"Cantidad",type:"number"},
  {id:"estado",label:"Estado",type:"choice",options:["Bueno","Regular","Dañado","En reparación"]},
  {id:"ubicacion",label:"Ubicación",type:"text"}
];
const STICKY=["categoria","ubicacion"];
const CACHE="inv-cache-v1";
let S={cols:DEFAULT_COLS.slice(),title:"TCS",notes:"",items:[]};
let db=null, downloads=null, lastSticky={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&Array.isArray(c.items))S=Object.assign(S,c);}catch(e){}
function cache(){try{localStorage.setItem(CACHE,JSON.stringify(S));}catch(e){}}

/* ---------- sync ---------- */
const chains={}, pending=new Map();
function setSync(t,off){const el=$("sync");el.textContent=t;el.classList.toggle("off",!!off);}
function queue(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn,fn);return chains[path];}
async function writeItem(it){
  cache(); if(!db) return;
  pending.set(it.id,it);
  queue("items/"+it.id,async()=>{
    try{const cur=pending.get(it.id); if(!cur) return;
      if(cur.__del) await db.doc("items/"+it.id).delete(); else {const {__del,...body}=cur; await db.doc("items/"+it.id).set(body);}
      pending.delete(it.id); if(!pending.size) setSync("Guardado");
    }catch(e){setSync("Sin conexión · guardado aquí, se sube al volver",true);}
  });
}
let cfgTimer=null;
function writeConfig(){
  cache(); if(!db) return;
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>queue("meta/config",async()=>{
    try{await db.doc("meta/config").set({cols:S.cols,title:S.title,notes:S.notes});setSync("Guardado");}
    catch(e){setSync("Sin conexión · guardado aquí",true);}
  }),700);
}
function retryPending(){ if(db&&pending.size) for(const it of [...pending.values()]) writeItem(it); }
setInterval(retryPending,20000); addEventListener("online",retryPending);

async function connect(){
  if(!window.claude||!window.claude.use) return;
  claude.use("downloads").then(d=>downloads=d).catch(()=>{});
  let d; try{d=await claude.use("db");}catch(e){d=null;}
  if(!d) return;
  db=d; setSync("Conectando…");
  db.doc("meta/config").onSnapshot(s=>{
    if(s.exists){const v=s.data(); if(!s.metadata.hasPendingWrites){
      S.cols=Array.isArray(v.cols)&&v.cols.length?v.cols:DEFAULT_COLS.slice();
      S.title=v.title||""; if(document.activeElement!==$("notes")) S.notes=v.notes||"";
      syncInputs(); cache(); render();}}
    else if(S.title||S.notes||JSON.stringify(S.cols)!==JSON.stringify(DEFAULT_COLS)) writeConfig();
  },()=>setSync("Guardado en este dispositivo",true));
  let first=true;
  db.collection("items").onSnapshot(snap=>{
    const remote=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
    if(first){first=false;
      const ids=new Set(remote.map(r=>r.id));
      S.items.filter(i=>!ids.has(i.id)).forEach(i=>writeItem(i)); // upload anything captured offline
    }
    const local=S.items.filter(i=>pending.has(i.id)&&!pending.get(i.id).__del);
    const map=new Map(remote.map(r=>[r.id,r])); local.forEach(l=>map.set(l.id,l));
    pending.forEach((v,k)=>{if(v.__del)map.delete(k);});
    S.items=[...map.values()]; cache(); render();
    if(!pending.size) setSync("Guardado");
  },()=>setSync("Guardado en este dispositivo",true));
}

/* ---------- render ---------- */
function stateClass(v){v=(v||"").toLowerCase(); if(v.startsWith("buen")) return "ok"; if(v.startsWith("regul")) return "warn"; if(v.includes("dañ")||v.includes("repar")||v.includes("mal")) return "bad"; return "";}
function val(it,id){return (it.v||{})[id];}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const items=S.items.slice().sort((a,b)=>(b.t||0)-(a.t||0));
  const shown=q?items.filter(it=>(Object.values(it.v||{}).join(" ")+" "+(it.nota||"")).toLowerCase().includes(q)):items;
  const hasQty=S.cols.some(c=>c.id==="cantidad");
  const units=items.reduce((n,it)=>n+(parseFloat(val(it,"cantidad"))||(hasQty?0:1)),0);
  const bad=items.filter(it=>stateClass(val(it,"estado"))==="bad").length;
  $("stats").innerHTML=`<span><b>${items.length}</b> registros</span>`+(hasQty?`<span><b>${units}</b> unidades</span>`:"")+(bad?`<span><b>${bad}</b> con daño o en reparación</span>`:"")+(q?`<span>Mostrando <b>${shown.length}</b></span>`:"");
  const list=$("list");
  if(!items.length){
    list.innerHTML=`<div class="empty"><h2>Sin equipos todavía</h2><p>Toca <b>+ Agregar equipo</b> para registrar el primero. Usa <b>Columnas</b> si la empresa anota algo que no está aquí, como código de activo o proveedor.</p></div>`;return;}
  if(!shown.length){list.innerHTML=`<div class="empty"><p>Nada coincide con “${esc(q)}”.</p></div>`;return;}
  const main=new Set(["nombre","cantidad","categoria","estado"]);
  list.innerHTML=shown.map(it=>{
    const name=val(it,"nombre")||"(sin nombre)";
    const chips=["categoria","estado"].filter(k=>S.cols.some(c=>c.id===k)&&val(it,k)).map(k=>`<span class="pill ${k==="estado"?stateClass(val(it,k)):""}">${esc(val(it,k))}</span>`).join("");
    const kv=S.cols.filter(c=>!main.has(c.id)&&val(it,c.id)!==undefined&&val(it,c.id)!=="").map(c=>`<div><span>${esc(c.label)}</span><div class="${c.mono?"mono":""}">${esc(val(it,c.id))}</div></div>`).join("");
    const qty=hasQty&&val(it,"cantidad")!==""&&val(it,"cantidad")!=null?`<span class="qty">${esc(val(it,"cantidad"))}</span>`:"";
    return `<button class="card" data-id="${esc(it.id)}"><div class="card-top"><span class="card-name">${esc(name)}</span>${qty}</div>${chips?`<div class="chips">${chips}</div>`:""}${kv?`<div class="kv">${kv}</div>`:""}${it.nota?`<div class="card-note">${esc(it.nota)}</div>`:""}</button>`;
  }).join("");
}
function syncInputs(){ if(document.activeElement!==$("place")) $("place").value=S.title; if(document.activeElement!==$("notes")) $("notes").value=S.notes; }

/* ---------- sheets ---------- */
function openSheet(html,onMount){
  $("sheetHost").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
  onMount&&onMount($("scrim").firstElementChild);
}
function closeSheet(){$("sheetHost").innerHTML="";}
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

function fieldHTML(c,v){
  const id="f_"+c.id; v=v??"";
  if(c.type==="choice"){
    const opts=(c.options||[]).map(o=>`<button type="button" class="opt" data-for="${id}" data-v="${esc(o)}" aria-pressed="${o===v}">${esc(o)}</button>`).join("");
    return `<div class="field"><label for="${id}">${esc(c.label)}</label><div class="opts">${opts}</div><input id="${id}" value="${esc(v)}" placeholder="O escribe otro…"></div>`;
  }
  const type=c.type==="number"?`type="number" inputmode="decimal" min="0"`:`type="text"`;
  return `<div class="field"><label for="${id}">${esc(c.label)}</label><input id="${id}" ${type} value="${esc(v)}" ${c.mono?'class="mono" autocapitalize="characters"':""}></div>`;
}
function openItem(it){
  const isNew=!it;
  const base=it?(it.v||{}):Object.assign({cantidad:S.cols.some(c=>c.id==="cantidad")?"1":undefined},lastSticky);
  const cols=S.cols, first=cols.filter(c=>c.id==="nombre"), rest=cols.filter(c=>c.id!=="nombre");
  const pairable=c=>c.type!=="choice";
  let body=first.map(c=>fieldHTML(c,base[c.id])).join(""), buf=[];
  rest.forEach(c=>{ if(pairable(c)){buf.push(c); if(buf.length===2){body+=`<div class="grid2">${buf.map(x=>fieldHTML(x,base[x.id])).join("")}</div>`;buf=[];}} else body+=fieldHTML(c,base[c.id]); });
  if(buf.length) body+=fieldHTML(buf[0],base[buf[0].id]);
  body+=`<div class="field"><label for="f_nota">Notas / detalles</label><textarea id="f_nota" placeholder="Accesorios, daños visibles, a quién está asignado…">${esc(it?it.nota:"")}</textarea></div>`;
  const actions=isNew
    ?`<button class="btn" id="sCancel">Cancelar</button><button class="btn grow" id="sSaveNext">Guardar y otro</button><button class="btn primary grow" id="sSave">Guardar</button>`
    :`<button class="btn danger" id="sDel">Eliminar</button><button class="btn grow" id="sCancel">Cancelar</button><button class="btn primary grow" id="sSave">Guardar cambios</button>`;
  openSheet(`<div class="row"><h3>${isNew?"Nuevo equipo":"Editar equipo"}</h3></div>${body}<div class="actions" id="sActs">${actions}</div>`,root=>{
    root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const inp=$(b.dataset.for); const on=b.getAttribute("aria-pressed")!=="true";
      inp.value=on?b.dataset.v:""; root.querySelectorAll(`.opt[data-for="${b.dataset.for}"]`).forEach(o=>o.setAttribute("aria-pressed",String(on&&o===b)));
    }));
    root.querySelectorAll(".field input").forEach(inp=>inp.addEventListener("input",()=>{
      root.querySelectorAll(`.opt[data-for="${inp.id}"]`).forEach(o=>o.setAttribute("aria-pressed",String(o.dataset.v===inp.value)));
    }));
    const n=$("f_nombre")||root.querySelector("input"); if(isNew&&n) setTimeout(()=>n.focus(),60);
    const collect=()=>{const v={}; S.cols.forEach(c=>{const el=$("f_"+c.id); if(el&&el.value.trim()!=="") v[c.id]=el.value.trim();}); return v;};
    const save=next=>{
      const v=collect(), nota=$("f_nota").value.trim();
      if(!Object.keys(v).length&&!nota){toast("Escribe al menos el nombre del equipo");return;}
      const rec=it?Object.assign({},it,{v:Object.assign({},it.v,v),nota}):{id:uid(),v,nota,t:Date.now()};
      if(it) S.cols.forEach(c=>{if(!(c.id in v)) delete rec.v[c.id];});
      S.items=S.items.filter(x=>x.id!==rec.id).concat([rec]);
      STICKY.forEach(k=>{if(v[k]) lastSticky[k]=v[k]; else delete lastSticky[k];});
      writeItem(rec); render();
      if(next){openItem(null); toast("Guardado · siguiente equipo");} else {closeSheet(); toast(it?"Cambios guardados":"Equipo agregado");}
    };
    $("sSave").onclick=()=>save(false);
    $("sCancel").onclick=closeSheet;
    if($("sSaveNext")) $("sSaveNext").onclick=()=>save(true);
    if($("sDel")) $("sDel").onclick=()=>{
      $("sActs").innerHTML=`<span class="hint" style="flex-basis:100%">¿Eliminar este equipo? No se puede deshacer.</span><button class="btn grow" id="sNo">No, conservar</button><button class="btn primary grow" id="sYes">Sí, eliminar</button>`;
      $("sNo").onclick=()=>{closeSheet();openItem(it);};
      $("sYes").onclick=()=>{S.items=S.items.filter(x=>x.id!==it.id); writeItem({id:it.id,__del:true}); render(); closeSheet(); toast("Equipo eliminado");};
    };
  });
}

function openCols(){
  const draw=()=>S.cols.map((c,i)=>`<div class="colrow" data-i="${i}"><input value="${esc(c.label)}" data-act="ren" aria-label="Nombre de columna"><span class="t">${c.type==="number"?"Número":c.type==="choice"?"Opciones":"Texto"}</span><button class="mini" data-act="up" aria-label="Subir">↑</button><button class="mini" data-act="del" aria-label="Quitar">✕</button></div>`).join("");
  openSheet(`<div class="row"><h3>Columnas</h3></div><p class="hint" style="margin:0">Renombra, ordena o quita columnas. Lo que ya anotaste en una columna quitada no se pierde del registro, solo deja de mostrarse.</p>
    <div id="colList" style="display:grid;gap:8px">${draw()}</div>
    <div class="field"><label for="ncLabel">Nueva columna</label><input id="ncLabel" placeholder="Ej. Código de activo, Proveedor, Año…"></div>
    <div class="grid2"><div class="field"><label for="ncType">Tipo</label><select id="ncType"><option value="text">Texto</option><option value="number">Número</option><option value="choice">Opciones para tocar</option></select></div>
    <div class="field" id="ncOptsF" hidden><label for="ncOpts">Opciones (separadas por coma)</label><input id="ncOpts" placeholder="Sí, No"></div></div>
    <div class="actions"><button class="btn grow" id="ncAdd">Añadir columna</button><button class="btn primary grow" id="ncDone">Listo</button></div>`,root=>{
    const list=$("colList");
    const commit=()=>{writeConfig();render();};
    list.addEventListener("input",e=>{const r=e.target.closest(".colrow"); if(e.target.dataset.act==="ren"){S.cols[+r.dataset.i]=Object.assign({},S.cols[+r.dataset.i],{label:e.target.value||"Sin nombre"}); commit();}});
    list.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; const i=+b.closest(".colrow").dataset.i;
      if(b.dataset.act==="up"&&i>0){const c=S.cols.slice();[c[i-1],c[i]]=[c[i],c[i-1]];S.cols=c;}
      if(b.dataset.act==="del"){if(b.dataset.confirm){S.cols=S.cols.filter((_,j)=>j!==i);} else {b.dataset.confirm="1";b.textContent="¿Quitar?";return;}}
      list.innerHTML=draw(); commit();});
    $("ncType").onchange=()=>{$("ncOptsF").hidden=$("ncType").value!=="choice";};
    $("ncAdd").onclick=()=>{const l=$("ncLabel").value.trim(); if(!l){toast("Escribe el nombre de la columna");return;}
      const c={id:"c"+uid(),label:l,type:$("ncType").value}; if(c.type==="choice") c.options=$("ncOpts").value.split(",").map(s=>s.trim()).filter(Boolean);
      S.cols=S.cols.concat([c]); $("ncLabel").value="";$("ncOpts").value=""; list.innerHTML=draw(); commit(); toast("Columna “"+l+"” añadida");};
    $("ncDone").onclick=closeSheet;
  });
}

/* ---------- export ---------- */
function table(sep){
  const cols=S.cols, head=cols.map(c=>c.label).concat(["Notas","Registrado"]);
  const cell=v=>{v=String(v??""); if(sep===","){return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;} return v.replace(/[\t\n]+/g," ");};
  const rows=S.items.slice().sort((a,b)=>(a.t||0)-(b.t||0)).map(it=>cols.map(c=>val(it,c.id)).concat([it.nota,it.t?new Date(it.t).toLocaleString("es-SV"):""]));
  return [head].concat(rows).map(r=>r.map(cell).join(sep)).join(sep===","?"\r\n":"\n");
}
function openExport(){
  openSheet(`<div class="row"><h3>Exportar</h3></div><p class="hint" style="margin:0">${S.items.length} registros${S.notes.trim()?" · los apuntes generales van aparte":""}.</p>
    <div style="display:grid;gap:8px">
      <button class="btn primary" id="exCsv">Descargar CSV (abre en Excel)</button>
      <button class="btn" id="exCopy">Copiar tabla para pegar en Excel o Sheets</button>
      <button class="btn" id="exNotes">Copiar apuntes generales</button>
      <button class="btn" id="exClose">Cerrar</button>
    </div><textarea id="exFallback" class="mono" hidden readonly style="width:100%;min-height:140px"></textarea>`,()=>{
    
    $("exCsv").onclick=async()=>{
      const name=("Inventario_"+(S.title||"equipos")).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"_").slice(0,60)+"_"+new Date().toISOString().slice(0,10)+".csv";
      try{await downloads.save({filename:name,data:"﻿"+table(",")});toast("Archivo listo");}
      catch(e){ if(e&&e.code!=="declined") toast("No se pudo descargar aquí. Usa “Copiar tabla”."); }
    };
    const copy=async(text,msg)=>{
      try{await navigator.clipboard.writeText(text);toast(msg);}
      catch(e){const f=$("exFallback");f.hidden=false;f.value=text;f.focus();f.select();toast("Selecciona el texto y cópialo");}
    };
    $("exCopy").onclick=()=>copy(table("\t"),"Tabla copiada · pégala en la celda A1");
    $("exNotes").onclick=()=>copy((S.title?S.title+"\n\n":"")+S.notes,"Apuntes copiados");
    $("exClose").onclick=closeSheet;
  });
}

let tt;function toast(m){let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=m; clearTimeout(tt); tt=setTimeout(()=>el.remove(),2200);}

/* ---------- wiring ---------- */
$("list").addEventListener("click",e=>{const c=e.target.closest(".card"); if(c) openItem(S.items.find(x=>x.id===c.dataset.id));});
$("fab").onclick=()=>openItem(null);
$("btnCols").onclick=openCols;
$("btnExport").onclick=openExport;
$("q").addEventListener("input",render);
$("place").addEventListener("input",e=>{S.title=e.target.value;writeConfig();});
$("notes").addEventListener("input",e=>{S.notes=e.target.value;writeConfig();});
$("btnStamp").onclick=()=>{const ta=$("notes"),t=new Date().toLocaleTimeString("es-SV",{hour:"2-digit",minute:"2-digit"});
  const pre=ta.value&&!ta.value.endsWith("\n")?"\n":""; ta.value+=pre+"["+t+"] "; S.notes=ta.value; writeConfig(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);};
function tab(which){const n=which==="notes";$("tabItems").setAttribute("aria-selected",String(!n));$("tabNotes").setAttribute("aria-selected",String(n));
  $("itemsView").hidden=n;$("notesView").hidden=!n;$("toolRow").hidden=n;$("fab").hidden=n;}
$("tabItems").onclick=()=>tab("items");$("tabNotes").onclick=()=>tab("notes");

syncInputs(); render(); connect();
})();
</script>

</body></html>
